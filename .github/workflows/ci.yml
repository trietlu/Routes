name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

  docker:
    name: Proxy Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/proxy/Dockerfile -t routes-proxy:ci .

      # PX-DOCKER-01: the container starts and answers /healthz.
      - name: Container answers /healthz
        run: |
          docker run -d --name proxy -p 8080:8080 -e PROVIDER=mock routes-proxy:ci
          for _ in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8080/healthz || true)
            if [ "$body" = '{"ok":true}' ]; then
              echo "healthz: $body"
              exit 0
            fi
            sleep 1
          done
          docker logs proxy
          exit 1

      - name: Container runs as non-root
        run: test "$(docker inspect --format '{{.Config.User}}' routes-proxy:ci)" = "nonroot"

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7

      # shellcheck is preinstalled on ubuntu-latest, so run scripts are checked too.
      - name: Run actionlint
        run: ./actionlint -color
