# E2E-17: tapping a result → 3 cards visible in under 3 s (mock proxy, NFR-1).
appId: com.routes.app.dev
---
- runFlow: ../common/home.yaml
- tapOn:
    id: 'field-to'
- tapOn:
    id: 'search-input'
- inputText: 'Union'
- extendedWaitUntil:
    visible:
      id: 'suggestion-fixture-union-station'
    timeout: 10000
- tapOn:
    id: 'suggestion-fixture-union-station'
- extendedWaitUntil:
    visible:
      id: 'route-card-C'
    timeout: 3000
